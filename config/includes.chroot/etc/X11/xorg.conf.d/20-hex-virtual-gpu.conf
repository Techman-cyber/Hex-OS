# Virtual GPUs (VirtualBox VMSVGA/VBoxSVGA, QEMU/KVM, VMware): the kernel modesetting driver is the stable choice.
# This only matches those kernel drivers, so real graphics cards are not affected.
Section "OutputClass"
    Identifier "HEX virtual GPU"
    MatchDriver "vmwgfx|vboxvideo|virtio_gpu|bochs|bochs-drm|qxl|cirrus"
    Driver "modesetting"
    Option "AccelMethod" "none"
    Option "ShadowFB" "true"
EndSection
