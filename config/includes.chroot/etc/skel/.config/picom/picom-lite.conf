# HEX smooth mode: fade in/out and soft shadows. No blur, no GPU needed, safe in virtual machines.
backend = "xrender";
vsync = false;
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.35;
shadow-offset-x = -10;
shadow-offset-y = -8;
shadow-exclude = [ "window_type = 'desktop'", "window_type = 'dock'", "_GTK_FRAME_EXTENTS@:c" ];
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;
inactive-opacity = 0.97;
opacity-rule = [ "92:class_g = 'Xfce4-terminal'" ];
