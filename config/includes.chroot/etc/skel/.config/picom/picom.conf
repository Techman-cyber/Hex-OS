# HEX blur: frosted glass for panels, dock and terminals.
backend = "glx";
vsync = false;
blur-method = "dual_kawase";
blur-strength = 6;
blur-background-exclude = [ "window_type = 'desktop'" ];
corner-radius = 12;
rounded-corners-exclude = [ "window_type = 'dock'", "window_type = 'desktop'", "class_g = 'Plank'" ];
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.45;
shadow-exclude = [ "window_type = 'desktop'", "class_g = 'Plank'", "window_type = 'dock'" ];
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
inactive-opacity = 0.95;
opacity-rule = [ "88:class_g = 'Xfce4-terminal'" ];
