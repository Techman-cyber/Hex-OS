name: Build HEX OS ISO

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # A real Debian 12 container, so the ISO is built with Debian's own (modern) live-build.
    container:
      image: debian:bookworm
      options: --privileged
    steps:
      - name: Install tools
        run: apt-get update && apt-get install -y git ca-certificates

      - uses: actions/checkout@v4

      - name: Check scripts for syntax mistakes
        shell: bash
        run: |
          bash -n build.sh
          for f in config/includes.chroot/usr/local/bin/* config/hooks/normal/*; do
            [ -e "$f" ] && bash -n "$f"
          done

      - name: Package check (advisory, never blocks)
        continue-on-error: true
        run: bash scripts/check-packages.sh

      - name: Build ISO
        shell: bash
        run: bash build.sh 2>&1 | tee build.log

      - name: Show the real error (only if the build failed)
        if: failure()
        shell: bash
        run: |
          MSG=$(tail -n 40 build.log 2>/dev/null | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build failed, last log lines::${MSG}"
          { echo '### Build failed. Last 80 log lines'; echo '```'; tail -n 80 build.log 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Checksum and size check
        shell: bash
        run: |
          cd out
          sha256sum *.iso > SHA256SUMS.txt
          ls -l
          SIZE=$(stat -c %s *.iso)
          if [ "$SIZE" -gt 2147483648 ]; then
            echo "ISO is over GitHub's 2 GiB release limit; splitting into parts."
            split -b 1900M -d --additional-suffix=.part *.iso "$(basename *.iso)."
            rm -f *.iso
            echo "Join with: cat hex-os.iso.*.part > hex-os.iso" > JOIN-INSTRUCTIONS.txt
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: hex-os-iso
          path: out/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: out/*
